[build-system]
requires = ["setuptools>=75,<81", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-frontier-lab"
version = "0.1.0"
description = "Foundational causal-information laboratory; not an FTL demonstration"
requires-python = ">=3.11"
dependencies = ["numpy==2.2.6"]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
